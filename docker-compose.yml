version: '3.8'

services:
  analyzer:
    image: python:3.11-slim
    container_name: linkbuddy-analyzer
    ports:
      - "8000:8000"
    volumes:
      - ./analyzer_app:/app
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn requests && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
